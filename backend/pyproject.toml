[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuentas-claras-backend"
version = "0.1.0"
description = "FastAPI backend for Cuentas Claras"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "asyncpg>=0.29,<1.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg2-binary>=2.9,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
]
dev = [
  "cuentas-claras-backend[test]",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["app", "migrations", "tests"]
pythonVersion = "3.11"
