name: cuentas_claras_mobile
description: Mobile shell for the Cuentas Claras MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

# This metadata pins the generator used by the later contract-freeze slice.
openapi_generator:
  cli: openapi-generator-cli
  cli_version: "7.19.0"
  generator: dart-dio
  input: ../contracts/openapi.json
  output: lib/generated/api

dependencies:
  flutter:
    sdk: flutter
  bloc: 9.1.0
  cookie_jar: 4.0.9
  dio: 5.8.0+1
  dio_cookie_manager: 3.2.0
  flutter_secure_storage: 10.0.0
  openapi:
    path: lib/generated/api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
